image: nixos/unstable
arch: x86_64
oauth: git.sr.ht/OBJECTS:RW git.sr.ht/REPOSITORIES:RO git.sr.ht/PROFILE:RO builds.sr.ht/JOBS:RW builds.sr.ht/PROFILE:RO builds.sr.ht/SECRETS:RO meta.sr.ht/PROFILE:RO
environment:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: http.userAgent
  GIT_CONFIG_VALUE_0: 'averagechris-fleet-pages (+https://averagechris.srht.site)'
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    extra-substituters = https://averagechris-dotfiles.cachix.org
    extra-trusted-public-keys = averagechris-dotfiles.cachix.org-1:VwJkl5dG1+xGDY5x884mH/kVwwpgwBAdBKIF3BZiia4=
sources:
  - https://git.sr.ht/~averagechris/hister#v1.0.0
secrets:
  - 5ec60320-e0d8-4ebe-8b45-1d10cc4d2cb2 # cachix averagechris-dotfiles -> ~/.ci_secrets/cachix_token
tasks:
  - release-artifact: |
      set -eu
      cd hister
      nix build .#release-artifact --out-link result-release-artifact
      mkdir -p ~/artifacts
      cp -p result-release-artifact/* ~/artifacts/
  - cache-warm: |
      set -eu
      cd hister
      if [ ! -f ~/.ci_secrets/cachix_token ]; then
        echo "no cachix token available; skipping cache warm"
        exit 0
      fi
      nix build .#default --out-link result-pkg
      set +x
      CACHIX_AUTH_TOKEN="$(cat ~/.ci_secrets/cachix_token)"
      export CACHIX_AUTH_TOKEN
      set -x
      # Push the artifact closure but only the top-level hister path: the
      # yt-dlp PATH wrapper drags a ~1.9GB python closure that is already
      # substitutable from cache.nixos.org.
      nix run --inputs-from . nixpkgs#cachix -- push averagechris-dotfiles result-release-artifact
      nix path-info ./result-pkg | nix run --inputs-from . nixpkgs#cachix -- push averagechris-dotfiles
  - upload-and-refresh: |
      set -eu
      cd hister
      set +x
      export SRHT_TOKEN="${SRHT_TOKEN:-${OAUTH2_TOKEN:-$(awk '/access-token/ { gsub(/"/, "", $2); print $2; exit }' ~/.config/hut/config 2>/dev/null || true)}}"
      set -x
      srht() { nix run --inputs-from . fleet#srht -- "$@"; }
      version="$(awk '
        /"version"[[:space:]]*:/ {
          line = $0
          sub(/^[^"]*"version"[[:space:]]*:[[:space:]]*"/, "", line)
          sub(/".*/, "", line)
          print line
          exit
        }
      ' webui/app/package.json)"
      [ -n "$version" ] || { printf '%s\n' 'could not read version from webui/app/package.json' >&2; exit 1; }
      tag="v${version#v}"
      commit="$(git rev-parse HEAD)"
      [ "$(git cat-file -t "refs/tags/$tag" 2>/dev/null || true)" = tag ] || {
        printf 'source checkout is missing annotated release tag %s\n' "$tag" >&2
        exit 1
      }
      [ "$(git rev-parse "refs/tags/$tag^{}")" = "$commit" ] || {
        printf 'source checkout HEAD does not match %s\n' "$tag" >&2
        exit 1
      }

      set -- result-release-artifact/*.tar.gz
      [ -e "$1" ] || { printf '%s\n' 'no release artifacts found' >&2; exit 1; }
      for artifact do
        (cd "$(dirname "$artifact")" && sha256sum -c "$(basename "$artifact").sha256")
        for upload in "$artifact" "$artifact.sha256"; do
          listing="$(srht --json git artifact list -r hister --rev "$tag")"
          if ARTIFACTS="$listing" NAME="$(basename "$upload")" nix run --inputs-from . nixpkgs#python3 -- -c \
            'import json,os,sys; names=[x["filename"] for x in json.loads(os.environ["ARTIFACTS"])["items"]]; sys.exit(0 if os.environ["NAME"] in names else 1)'; then
            printf 'artifact already uploaded: %s\n' "$(basename "$upload")"
          else
            srht git artifact upload -r hister --rev "$tag" "$upload"
          fi
        done
      done

      manifest="$(mktemp)"
      cat > "$manifest" <<EOF
      image: nixos/unstable
      arch: x86_64
      oauth: pages.sr.ht/PAGES:RW
      environment:
        GIT_CONFIG_COUNT: "1"
        GIT_CONFIG_KEY_0: http.userAgent
        GIT_CONFIG_VALUE_0: "averagechris-fleet-pages (+https://averagechris.srht.site)"
        NIX_CONFIG: |
          experimental-features = nix-command flakes
          extra-substituters = https://averagechris-dotfiles.cachix.org
          extra-trusted-public-keys = averagechris-dotfiles.cachix.org-1:VwJkl5dG1+xGDY5x884mH/kVwwpgwBAdBKIF3BZiia4=
        TRIGGER_SOURCE: release
        TRIGGER_PROJECT: hister
        TRIGGER_TAG: $tag
        TRIGGER_SHA: $commit
      sources:
        - https://git.sr.ht/~averagechris/averagechris.srht.site
      tasks:
        - refresh: |
            cd averagechris.srht.site
            nix run .#refresh-pages
      EOF
      # The refresh manifest has oauth grants, and sr.ht only provisions its
      # bearer token when the submitting client enables secrets.
      build_tag="hister/$tag/refresh"
      jobs="$(srht --json builds list --all --tag "$build_tag")"
      if JOBS="$jobs" nix run --inputs-from . nixpkgs#python3 -- -c \
        'import json,os,sys; failed={"failed","cancelled"}; statuses=[str(x["status"]).lower() for x in json.loads(os.environ["JOBS"])["items"]]; sys.exit(0 if any(x not in failed for x in statuses) else 1)'; then
        printf 'refresh already active or successful: %s\n' "$build_tag"
      else
        srht builds submit "$manifest" --secrets --note "site refresh: hister $tag" --tag "$build_tag"
      fi
artifacts:
  - artifacts/hister-v1.0.0-x86_64-linux.tar.gz
  - artifacts/hister-v1.0.0-x86_64-linux.tar.gz.sha256

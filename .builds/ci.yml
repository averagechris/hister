image: nixos/unstable
arch: x86_64
environment:
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    extra-substituters = https://averagechris-dotfiles.cachix.org
    extra-trusted-public-keys = averagechris-dotfiles.cachix.org-1:VwJkl5dG1+xGDY5x884mH/kVwwpgwBAdBKIF3BZiia4=
sources:
  - https://git.sr.ht/~averagechris/hister
secrets:
  - 731f7e55-4497-4228-8fa4-1657da7d3625 # cachix averagechris-dotfiles -> ~/.ci_secrets/cachix_token
tasks:
  - static-checks: cd hister && nix run .#static-checks
  - test: cd hister && nix run .#ci-test
  - package: cd hister && nix build .#default --print-build-logs
  - closure-size: |
      cd hister
      nix path-info -S ./result
      nix path-info -rS ./result | sort -k2 -n | tail -n 5
  - cache-warm: |
      cd hister
      if [ ! -f ~/.ci_secrets/cachix_token ]; then
        echo "no cachix token available; skipping cache warm"
        exit 0
      fi
      CACHIX_AUTH_TOKEN="$(cat ~/.ci_secrets/cachix_token)"
      export CACHIX_AUTH_TOKEN
      # Push only the hister output path, not the runtime closure: the
      # yt-dlp PATH wrapper drags a ~1.9GB python closure that is already
      # substitutable from cache.nixos.org.
      nix path-info ./result | nix run --inputs-from . nixpkgs#cachix -- push averagechris-dotfiles
